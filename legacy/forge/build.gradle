plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "e4steam.mixins.json"
    }
}

sourceSets.main {
    java.srcDir("../../forge/src/main/java")
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }

    // Forge 1.17/1.18 does not load Loom's META-INF/jars dependency here.
    // Shade Kaleido so Config's superclass is available during mod construction.
    shadowCommon("folk.sisby:kaleido-config:0.3.3+1.3.2") { transitive = false }
    shadowCommon("com.code-disaster.steamworks4j:steamworks4j:${rootProject.steamworks4j_version}") {
        transitive = false
    }
    shadowCommon("org.jetbrains.kotlin:kotlin-stdlib:${rootProject.kotlin_version}") {
        transitive = false
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude("fabric.mod.json")
    exclude("architectury.common.json")
    exclude("steam_api.dll")
    exclude("steamworks4j.dll")
    exclude("libsteam_api.dylib")
    exclude("libsteamworks4j.dylib")
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = "legacy17"
}

sourcesJar {
    archiveClassifier = "sources-legacy17"
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
