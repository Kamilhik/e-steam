pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.minecraftforge.net/" }
        maven { url "https://maven.neoforged.net/releases/" }
        gradlePluginPortal()
    }
}

include("common")
providers.gradleProperty("enabled_platforms")
        .getOrElse("fabric,forge,neoforge")
        .split(",")
        .collect { it.trim() }
        .findAll { !it.isEmpty() }
        .each { include(it) }

rootProject.name = "e4steam"
