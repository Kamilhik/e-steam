plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "unstubbedJar")) { transitive false }

    include 'folk.sisby:kaleido-config:0.3.3+1.3.2'
    shadowCommon("com.code-disaster.steamworks4j:steamworks4j:${rootProject.steamworks4j_version}") {
        transitive false
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "architectury.common.json"
    exclude "steam_api.dll"
    exclude "steamworks4j.dll"
    exclude "libsteam_api.dylib"
    exclude "libsteamworks4j.dylib"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"

}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

// Minecraft 26.1+ Fabric runs mods in Mojang's named namespace. Keep the
// regular intermediary JAR for 1.17-1.21 and produce a second, named JAR for
// the modern year-based releases from the exact same tested source.
tasks.register('patchModernMetadata', Jar) {
    archiveClassifier = 'dev-shadow-modern'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(file("src/main/resources-modern"), zipTree(shadowJar.archiveFile))
    dependsOn shadowJar
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.register("modernRemapJar", net.fabricmc.loom.task.RemapJarTask) {
    injectAccessWidener = true
    input.set patchModernMetadata.archiveFile
    dependsOn patchModernMetadata
    archiveClassifier = "modern"
    sourceNamespace = "intermediary"
    targetNamespace = "named"
}

sourcesJar {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
    def commonSources = project(":common").unstubbedSourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
